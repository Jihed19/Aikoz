    <!-- Deep Brand Green Wave -->
    <path
      d="M 38 88 C 38 72, 54 48, 86 44 C 90 43.5, 92 47, 88 49 C 64 57, 50 72, 46 89 C 45.5 92, 38.5 92, 38 88 Z"
      fill="#5DBB63"
