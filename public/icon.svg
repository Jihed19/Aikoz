<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="110" fill="#FFFFFF"/>
  <!-- Circular ambient glow -->
  <circle cx="256" cy="256" r="210" fill="#F4FBF6"/>
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" stroke="#E2F2E7" stroke-width="4"/>
  
  <!-- Aikoz Icon / Brand Waves -->
  <g transform="translate(146, 120) scale(2.3)">
    <!-- Yellow Wave -->
    <path
      d="M 18 72 C 14 50, 36 18, 70 14 C 74 13.5, 76 17, 72 19 C 45 27, 28 48, 25 73 C 24.5 76, 18.5 76, 18 72 Z"
